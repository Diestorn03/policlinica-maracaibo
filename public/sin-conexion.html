<!doctype html>
<!-- Lo muestra sw.js cuando no hay conexión al abrir una página. Sin recursos externos (no habría red para pedirlos). -->
<html lang="es-VE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#014db7">
  <title>Sin conexión | Policlínica Maracaibo</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; background: #edeffa; color: #24345f; font: 1rem/1.6 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    main { width: min(28rem, 100%); padding: 2rem; border-radius: 16px; background: #fff; box-shadow: 0 18px 40px -32px rgba(36, 52, 95, .45); text-align: center; }
    .marca { margin: 0 0 1.5rem; font-weight: 700; letter-spacing: -.02em; color: #014db7; }
    h1 { margin: 0 0 .5rem; font-size: 1.6rem; line-height: 1.15; letter-spacing: -.03em; }
    p { margin: 0 0 1.25rem; color: #4b587c; }
    button { min-height: 52px; padding: .8rem 1.8rem; border: 0; border-radius: 999px; background: #014db7; color: #fff; font: inherit; font-weight: 600; line-height: 1; cursor: pointer; }
    button:focus-visible { outline: 3px solid #24345f; outline-offset: 3px; }
    .sos { margin: 1.5rem 0 0; font-size: .9375rem; }
    .sos a { color: #c62828; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <p class="marca">Policlínica Maracaibo</p>
    <h1>Sin conexión</h1>
    <p>No pudimos abrir la página. Revisa tu conexión a internet y vuelve a intentarlo.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
    <p class="sos">¿Es una emergencia? Llama al <a href="tel:+582617005141">+58 (0261) 700-5141</a>.</p>
  </main>
</body>
</html>
